# CPASS Production Nginx Reverse Proxy Configuration
# Serves React 18 SPA at root (/) and proxies /api/ requests to FastAPI backend (port 8000)

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge path for Let's Encrypt / Certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static asset caching for Vite hashed bundles
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API Reverse Proxy: strip /api prefix and forward to backend container
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://cpass-backend:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Support document uploads up to 10 MB plus form overhead
        client_max_body_size 25M;

        # Prevent premature timeouts during large file uploads to Google Drive
        proxy_connect_timeout 60s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        # Disable buffering for streaming document downloads
        proxy_buffering off;
    }

    # React SPA fallback: route all unmatched paths to index.html for client-side routing
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Custom error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

